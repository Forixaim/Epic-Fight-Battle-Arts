modLoader="javafml" #mandatory
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="${issueTracker}"
[[mods]]
modId="${modId}"
version="${modVersion}"
displayName="${displayName}"
logoFile= "${modId}_title.png"
credits="Epic Fight"
authors="${authors}"

description="${description}"
[[dependencies."${modId}"]]
   modId="epicfight"
   mandatory=true
   versionRange="[21.17,)"
   ordering="AFTER"
   side="BOTH"

[[dependencies."${modId}"]]
   modId = "neoforge"
   type = "required"
   versionRange = "[${neoforgeVersion},)"
   ordering = "NONE"
   side = "BOTH"

[[dependencies."${modId}"]]
   modId = "minecraft"
   type = "required"
   versionRange = "[${minecraft}]"
   ordering = "NONE"
   side = "BOTH"

[[accessTransformers]]
   file="META-INF/accesstransformer.cfg"
