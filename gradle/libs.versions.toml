[versions]

moddevgradle = "2.0.134"
epic-fight = "21.17.2-mc1.21.1-neoforge"
epicskills = "21.3.1-1.21.1"
simplyswords = "1.63.0-1.21.1"
modPublish = "1.1.0"
battleArtsAPI = "21.17.7-mc1.21.1-neoforge"
epicFightLocal = "21.17.2"
dummy = "1.21-2.0.12-neoforge"
moonlight = "1.21-2.29.33-neoforge"
simplytooltips = "0.1.3"
architectury = "13.0.8+neoforge"
fzzy = "0.7.6+1.21+neoforge"
kotlin = "5.11.0"
parcool = "1.21.1-3.4.3.3"
epicparcool = "21.0.0-1.21.1"

mcSafeResources = "0.0.2"

[libraries]

epicFight = { module = "maven.modrinth:epic-fight", version.ref = "epic-fight" }
epicskills = { module = "maven.modrinth:epic-fight-skill-tree", version.ref = "epicskills"}
battleArtsAPI = { module = "maven.modrinth:battle-arts-api", version.ref = "battleArtsAPI"}
epicFightTest = { group = "libs", name = "epicfight", version.ref = "epicFightLocal"}
dummy = { group = "maven.modrinth", name = "mmmmmmmmmmmm", version.ref = "dummy"}
moonlight = { group = "maven.modrinth", name = "moonlight", version.ref = "moonlight"}
simplyswords = { group = "maven.modrinth", name = "simply-swords", version.ref = "simplyswords"}
fzzy = {group = "maven.modrinth", name = "fzzy-config", version.ref = "fzzy"}
architectury = {group = "maven.modrinth", name = "architectury-api", version.ref = "architectury"}
simplytooltips = {group = "maven.modrinth", name = "simply-tooltips", version.ref = "simplytooltips"}
kotlin = {group = "maven.modrinth", name = "kotlin-for-forge", version.ref = "kotlin"}
parcool = {group = "maven.modrinth", name = "parcool", version.ref = "parcool"}
epicparcool = {group = "maven.modrinth", name = "official-epic-x-parcool", version.ref = "epicparcool"}


[plugins]
eclipse = { id = "eclipse"}
idea = { id = "idea"}
javalib = { id = "java-library"}
mcSafeResources = { id = "dev.echoellet.mc-safe-resources", version.ref = "mcSafeResources" }

#Core Gradle Stuff
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
publisher = { id = "me.modmuss50.mod-publish-plugin", version.ref = "modPublish"}

[bundles]

simplyswords = ["simplyswords", "simplytooltips", "architectury", "kotlin", "fzzy"]
epicfight = ["epicFightTest", "battleArtsAPI", "epicskills"]
parcool = ["parcool", "epicparcool"]